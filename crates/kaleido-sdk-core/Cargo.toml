[package]
name = "kaleido-sdk-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
description = "Taker SDK core for the KaleidoSwap maker /v2 API + swap protocol"
repository = "https://github.com/kaleidoswap/kaleido-sdk"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
hex = "0.4"
# Fresh per-session MuSig2 nonces (BIP-327). Pinned to the same major as
# maker-musig so `OsRng` satisfies its `rand::{RngCore,CryptoRng}` bounds.
rand = "0.8"

# Crypto (verify/sign/spend) reuses the maker's audited primitives rather
# than reimplementing consensus-critical code. Path dep for local dev
# (sibling checkout); swap to a git dep (rev-pinned) for CI. NEVER
# reimplement these — `verify/` mirrors `maker-swap/src/create.rs` and
# `sign/` mirrors `maker-api/src/coop.rs` exactly.
maker-musig = { path = "../../../kaleidoswap-maker-rs/crates/maker-musig" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Schnorr verification of aggregated MuSig2 signatures in `sign` tests.
bitcoin = "0.32"
