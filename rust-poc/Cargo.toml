[workspace]
members = [
    "kaleidoswap-core",
    "kaleidoswap-python",
    "kaleidoswap-node",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
